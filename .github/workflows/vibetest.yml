name: Vibetest integration
on:
  push:
    branches: [main, main_chatgpt]
    paths:
      - 'requirements-vibetest.*'
      - 'tools/vibetest_drive.py'
      - 'tests/test_vibetest_runner.py'
      - '.github/workflows/vibetest.yml'
  pull_request:
    paths:
      - 'requirements-vibetest.*'
      - 'tools/vibetest_drive.py'
      - 'tests/test_vibetest_runner.py'
      - '.github/workflows/vibetest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-vibetest.txt
      - name: Use installed Chrome
        run: |
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "DRIVENOW_CHROMIUM=$chrome" >> "$GITHUB_ENV"
      - run: python tools/vibetest_drive.py --check

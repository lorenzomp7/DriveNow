name: Browser checks
on:
  push:
    branches: [main, main_chatgpt]
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.txt pytest
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest
      - run: python tests/browser/check_ui.py

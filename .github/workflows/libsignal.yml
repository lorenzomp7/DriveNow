name: LibSignal integration
on:
  push:
    branches: [main_claude]
    paths:
      - 'drivenow/**'
      - 'tools/libsignal_smoke.py'
      - 'tests/test_libsignal.py'
      - 'requirements-libsignal.txt'
      - '.github/workflows/libsignal.yml'
  pull_request:
    paths:
      - 'drivenow/**'
      - 'tools/libsignal_smoke.py'
      - 'tests/test_libsignal.py'
      - 'requirements-libsignal.txt'
      - '.github/workflows/libsignal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sumo-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DaRL-LibSignal/LibSignal
          ref: 127af9f93902778e556de2eedb2b606c4c9447e6
          path: .ci-libsignal
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-libsignal.txt pytest==9.2.0
      - run: python -m pytest tests/test_libsignal.py -q
      - run: python tools/libsignal_smoke.py --libsignal-root .ci-libsignal --steps 900 --learn-signals
